<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FaceAttend — Sign In</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
        rel="stylesheet">
  <style>
    body { background: #0b0f19; min-height: 100vh;
           display: flex; align-items: center; justify-content: center; }
    .login-card { background: #131b2e; border: 1px solid rgba(56,189,248,.2);
                  border-radius: 1rem; width: 100%; max-width: 400px;
                  box-shadow: 0 8px 32px rgba(0,0,0,.5); }
    .login-card .card-title { color: #38bdf8; }
    .form-control { background: #1e293b; color: #e2e8f0; border-color: rgba(56,189,248,.25); }
    .form-control:focus { background: #1e293b; color: #e2e8f0;
                          border-color: #38bdf8; box-shadow: 0 0 0 .2rem rgba(56,189,248,.25); }
    .form-label { color: #94a3b8; }
  </style>
</head>
<body>
  <div class="login-card p-4 p-md-5">
    <div class="text-center mb-4">
      <i class="bi bi-camera-video-fill text-info" style="font-size:2.5rem"></i>
      <h3 class="card-title mt-2 fw-bold">FaceAttend</h3>
      <p class="text-secondary small">Face Recognition Attendance System</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} py-2">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}">
      <div class="mb-3">
        <label class="form-label" for="username">Username</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary">
            <i class="bi bi-person text-info"></i>
          </span>
          <input type="text" id="username" name="username"
                 class="form-control" placeholder="Enter username"
                 required autofocus autocomplete="username">
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label" for="password">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary">
            <i class="bi bi-lock text-info"></i>
          </span>
          <input type="password" id="password" name="password"
                 class="form-control" placeholder="Enter password"
                 required autocomplete="current-password">
        </div>
      </div>
      <button type="submit" class="btn btn-info w-100 fw-semibold">
        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
      </button>
    </form>
    <p class="text-secondary text-center mt-3 small">
      </code>
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
          crossorigin="anonymous"></script>
</body>
</html>
