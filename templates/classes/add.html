{% extends "base.html" %}
{% block title %}Add Class — FaceAttend{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-header bg-dark text-light">
        <i class="bi bi-plus-circle me-2"></i>Add New Class
      </div>
      <div class="card-body">
        <form method="POST" action="{{ url_for('classes_add') }}">
          <div class="mb-3">
            <label class="form-label fw-semibold" for="name">Class Name</label>
            <input type="text" id="name" name="name" class="form-control"
                   placeholder="e.g. Class 10" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold" for="section">Section</label>
            <input type="text" id="section" name="section" class="form-control"
                   placeholder="e.g. A" required>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-info">
              <i class="bi bi-check-lg me-1"></i>Create Class
            </button>
            <a href="{{ url_for('classes_list') }}" class="btn btn-outline-secondary">
              Cancel
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
